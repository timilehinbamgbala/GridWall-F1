<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons8-formula-1-96.png"
    />

    <!-- Touch icon (home screen bookmark on iOS & Android) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons8-formula-1-100.png"
    />
    <link rel="apple-touch-icon" sizes="96x96" href="icons8-formula-1-96.png" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GridWall" />
    <meta name="application-name" content="GridWall F1" />

    <!-- Social / OG preview when link is shared -->
    <meta property="og:title" content="GridWall — F1 2026" />
    <meta
      property="og:description"
      content="Live F1 2026 race results, driver standings and head-to-head stats."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GridWall — F1 2026" />
    <meta
      name="twitter:description"
      content="Live F1 2026 race results, driver standings and head-to-head stats."
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridWall F1</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
